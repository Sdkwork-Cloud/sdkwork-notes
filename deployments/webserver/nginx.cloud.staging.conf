# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/notes/webserver.pid;
error_log /var/log/sdkwork/notes/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name notes-staging.sdkwork.com notes-staging.birdcoder.com notes-staging.dtupay.com notes-staging.sdkwork.cn notes-staging.birdcoder.cn notes-staging.dtupay.cn notes-staging.skubc.com notes-staging.skubc.cn notes-staging.zowalk.com notes-staging.zowalk.cn notes-staging.offer86.com notes-staging.offer86.cn notes-staging.86offer.com notes-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
