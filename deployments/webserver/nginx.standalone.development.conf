# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/notes/webserver.pid;
error_log /var/log/sdkwork/notes/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name notes-dev.sdkwork.com notes-dev.birdcoder.com notes-dev.dtupay.com notes-dev.noaper.com notes-dev.sdkwork.cn notes-dev.birdcoder.cn notes-dev.dtupay.cn notes-dev.noaper.cn notes-dev.skubc.com notes-dev.skubc.cn notes-dev.zowalk.com notes-dev.zowalk.cn notes-dev.offer86.com notes-dev.offer86.cn notes-dev.86offer.com notes-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
